[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = paste@localhost

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:/usr/lib/ckan/default/src/ckan/test-core.ini
ckan.plugins = fluent scheming_datasets schema_field_groups issues odm_dataset_ext odm_dataset_resource odm_mimu_harvester odm_agreement odm_library odm_laws odm_notifications

scheming.dataset_schemas = ckanext.odm_dataset_ext:odm_dataset_schema.json
scheming.presets = ckanext.fluent:presets.json ckanext.odm_dataset_ext:odm_dataset_presets.json
scheming.dataset_fallback = false
ckanext-odm_dataset_ext.country_code = *
ckanext.issues.new.description_link = https://wiki.opendevelopmentmekong.net/partners:content_review#
ckanext.issues.anchor_tag.laws_record = instructions_for_default_issue_on_law_records
ckanext.issues.anchor_tag.agreement =
ckanext.issues.anchor_tag.library_record = instructions_for_default_issue_on_library_records
ckanext.issues.anchor_tag.dataset = instructions_for_default_issue_on_datasets
ckanext.issues.notify_admin = true
ckanext.issues.notify_owner = true
ckanext.issues.from_address = info@opendevmekong.net
ckanext.issues.review_system = true


# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s